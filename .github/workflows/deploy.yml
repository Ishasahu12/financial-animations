name: Render and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render videos
        run: |
          npx remotion render Dashboard out/dashboard.mp4
          npx remotion render BarChart out/barchart.mp4
          npx remotion render PieChart out/piechart.mp4
          npx remotion render LineChart out/linechart.mp4
          npx remotion render NumberCounter out/numbercounter.mp4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
